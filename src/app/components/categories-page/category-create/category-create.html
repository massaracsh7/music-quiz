<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex gap-2">
      <a class="text-decoration-none" [routerLink]="['/categories']" aria-label="{{ 'CATEGORIES_PAGE.TITLE' | translate }}">
        <h2 class="mb-0" role="heading" aria-level="2">
          <i class="bi bi-collection me-2" aria-hidden="true"></i>
          {{ 'CATEGORIES_PAGE.TITLE' | translate }}
        </h2>
      </a>
      <h2 class="mb-0" role="heading" aria-level="2">
        {{ 'CATEGORY_CREATE_PAGE.BREADCRUMB' | translate }}
      </h2>
    </div>

    <button
      class="btn btn-primary"
      [routerLink]="['/categories']"
      aria-label="{{ 'CATEGORY_CREATE_PAGE.BACK_BUTTON' | translate }}"
    >
      <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
      {{ 'CATEGORY_CREATE_PAGE.BACK_BUTTON' | translate }}
    </button>
  </div>

  <div class="row">
    <div class="col-lg-7">
      <app-category-search></app-category-search>
    </div>
    <div class="col-lg-5">
      <app-category-form></app-category-form>
    </div>
  </div>
</div>
