<h2>Admin Panel</h2>

<table>
  <thead>
    <tr>
      <th>Email</th>
      <th>Display Name</th>
      <th>Role</th>
      <th>Change Role</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users(); track user.email) {
      <tr>
        <td>{{ user.email }}</td>
        <td>{{ user.displayName }}</td>
        <td>{{ user.role }}</td>
        <td>
          <select
            [value]="user.role"
            (change)="changeRole(user, $any($event.target).value)"
          >
            @for (option of options; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </td>
      </tr>
    }
  </tbody>
</table>
