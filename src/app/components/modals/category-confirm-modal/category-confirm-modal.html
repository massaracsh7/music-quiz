<div
  class="modal fade"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'category-confirm-title'"
  [class.show]="showCategoryDialog()"
  [style.display]="showCategoryDialog() ? 'block' : 'none'"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <h5
          id="category-confirm-title"
          class="modal-title"
          aria-live="polite"
        >
          {{
            'GAME_FIELD.CATEGORY_CONFIRM_MODAL.TITLE'
              | translate: { categoryName: selectedCategory()?.title }
          }}
        </h5>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="closeCategoryDialog.emit()"
          aria-label="{{ 'GAME_FIELD.CATEGORY_CONFIRM_MODAL.CANCEL_BUTTON' | translate }}"
        >
          {{ 'GAME_FIELD.CATEGORY_CONFIRM_MODAL.CANCEL_BUTTON' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="onCategorySelectDialogClose.emit(selectedCategory()!)"
          aria-label="{{ 'GAME_FIELD.CATEGORY_CONFIRM_MODAL.CONFIRM_BUTTON' | translate }}"
        >
          {{ 'GAME_FIELD.CATEGORY_CONFIRM_MODAL.CONFIRM_BUTTON' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
