<div
  class="modal fade"
  #resultModal
  tabindex="-1"
  [class.show]="showResultDialog()"
  [style.display]="showResultDialog() ? 'block' : 'none'"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5
          class="modal-title"
          [style.color]="(resultMessage() || '').includes('Correct') ? 'green' : 'red'"
        >
          {{ (resultMessage() || '').includes('Correct') ? 'Correct!' : 'Incorrect' }}
        </h5>
      </div>
      <div class="modal-body">
        <p>{{ resultMessage() || '' }}</p>
        @let artworkUrl = currentTrack()?.artworkUrl100;
        @if (artworkUrl) {
          <img
            class="result-img"
            [style.border-color]="(resultMessage() || '').includes('Correct') ? 'green' : 'red'"
            [src]="artworkUrl.replace('100x100bb.jpg', '300x300bb.jpg')"
            alt="artwork"
          />
        }

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="closeDialog.emit()">OK</button>
      </div>
    </div>
  </div>
</div>
