<ul class="nav col-12 col-md-auto mb-2 mb-md-0 d-flex flex-column flex-lg-row justify-content-center">
  @for (link of navShowList(); track link.label) {
    <li class="nav-item">
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        class="nav-link px-2 d-flex align-items-center"
      >
        <i class="bi bi-{{ link.icon }} me-1"></i>
        {{ link.label | translate }}
      </a>
    </li>
  }
</ul>
