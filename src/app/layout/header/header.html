<header
  class="d-flex flex-wrap justify-content-between align-items-center py-3 mb-4 border-bottom gap-4"
>
  <div class="d-flex align-items-center gap-4">
    <a href="/" class="d-flex align-items-center text-decoration-none link-body-emphasis">
      <span class="fs-4">Music Quiz</span>
    </a>
    <app-theme-toggle></app-theme-toggle>
    <div class="dropdown lang-switcher">
      <button
        class="btn dropdown-toggle"
        type="button"
        id="langDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false">
        🌐 {{ currentLang() | uppercase }}
      </button>

      <ul class="dropdown-menu" aria-labelledby="langDropdown">
        <li>
          <a class="dropdown-item cursor-pointer" (click)="switchLang('en')">English</a>
        </li>
        <li>
          <a class="dropdown-item cursor-pointer" (click)="switchLang('be')">Беларуская</a>
        </li>
        <li>
          <a class="dropdown-item cursor-pointer" (click)="switchLang('ru')">Русский</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <app-nav-menu></app-nav-menu>
    <app-user-menu></app-user-menu>
  </div>
</header>
